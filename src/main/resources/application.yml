server:
  port: ${SERVER_PORT:9527}
  address: ${SERVER_ADDRESS:0.0.0.0}

# --------------------------------------- 用户自定义修改项 ------------------------------------
# ⚠️ 请使用环境变量配置敏感信息，不要在此处硬编码！
# web登录管理员账号密码（从环境变量读取）
# 必填：ADMIN_PASSWORD（或 WEB_PASSWORD）未设置、为空、短于 8 位，或仍为示例占位值时，
# 启动校验器 StartupCredentialValidator 会拒绝启动。请先在 .env 中设置强密码。
web:
  account: ${ADMIN_USERNAME:${WEB_ACCOUNT:admin}}
  password: ${ADMIN_PASSWORD:${WEB_PASSWORD:}}
  cors:
    # 默认空 = 仅同源，不开放跨域。生产如需跨域，再显式设置域名列表（逗号分隔）。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

clients:
  download-dir: ${CLIENT_DOWNLOAD_DIR:/app/king-detective/deploy/downloads}
  version: ${KING_DETECTIVE_CLIENT_VERSION:0.1.2}
  release-repository: ${KING_DETECTIVE_GITHUB_REPOSITORY:tony-wang1990/Wang-Detective-2}

ops:
  ssh:
    # 必填：OPS_SSH_SECRET_KEY 未设置时启动拒绝。不再回退到管理员密码；
    # 请设置为与管理员密码不同的另一段随机长密钥。
    secret-key: ${OPS_SSH_SECRET_KEY:}

# Telegram Bot 配置（必须使用环境变量）
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:${BOT_TOKEN:}}
    chat-id: ${TELEGRAM_BOT_CHAT_ID:${TELEGRAM_CHAT_ID:${TG_CHAT_ID:}}}
    username: ${TELEGRAM_BOT_USERNAME:king_detective_bot}
# --------------------------------------- 用户自定义修改项 ------------------------------------

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${DB_URL:jdbc:sqlite:/app/king-detective/data/king-detective.db}
  servlet:
    multipart:
      max-file-size: ${SFTP_UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${SFTP_UPLOAD_MAX_REQUEST_SIZE:50MB}
  sql:
    init:
      mode: always
mybatis-plus:
  mapper-locations: classpath*:com/tony/kingdetective/mapper/xml/*.xml

logging:
  pattern:
    # console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %msg%n"
  level:
    com.oracle.bmc: error
    c.o.b.h.c.j: error

# 密钥文件存放目录（如果是docker部署则不用修改）
oci-cfg:
  boot-broadcast-url: https://backend.king-detective.de5.net/api/boot
  key-dir-path: /app/king-detective/keys
#  key-dir-path: C:\\Users\\yatao\\Desktop

# 实例创建配置
instance-creation:
  # 抢机重试间隔（秒）- 可自定义，例如改成30秒、60秒等
  retry-interval-seconds: 80

# feat #17: 定时自动备份配置
king-detective:
  backup:
    # 是否开启定时自动备份（true=开启，false=关闭）
    auto-enabled: ${AUTO_BACKUP_ENABLED:false}
    # 备份 Cron 表达式（默认每天凌晨3点执行）
    cron: ${AUTO_BACKUP_CRON:0 0 3 * * ?}
    # 备份加密密码（建议通过环境变量配置）
    password: ${AUTO_BACKUP_PASSWORD:}
  # feat: 实例状态监控推送
  instance-monitor:
    # 是否开启实例状态变化推送（默认开启，可通过 INSTANCE_MONITOR_ENABLED=false 关闭）
    enabled: ${INSTANCE_MONITOR_ENABLED:true}
    # 检查间隔（毫秒），默认 5 分钟
    interval-ms: ${INSTANCE_MONITOR_INTERVAL_MS:300000}
